# Drop-in para canario-api: regenera el version.json de Node al arrancar,
# reutilizando SIN MODIFICAR el generador existente de lab/vm-version/
# (generate-version-json-node.sh lee el binario desde ExecStart de la
# unidad indicada en EPIPHYLLUM_UNIT). Instalación en docs/10.
[Service]
ExecStartPost=/usr/local/sbin/epiphyllum-generate-version-json-node
Environment=EPIPHYLLUM_UNIT=canario-api
