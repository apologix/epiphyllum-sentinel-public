# Outsourcing Canario — sitio de laboratorio en la VM debian13-lab.
# Instalar como /etc/nginx/sites-available/canario (ver docs/10-DESPLIEGUE-VM.md).
#
# COMPATIBILIDAD SENTINEL (verificado contra mcp/adapters/nginx.py):
# el access.log PRINCIPAL usa EXACTAMENTE el formato sentinel_lab del
# laboratorio (8 claves JSON cerradas). Añadir request_id a ese formato
# ROMPE el adaptador nginx-access@1 (probado: devuelve cero eventos).
# Por eso:
#  - access.log  -> formato sentinel_lab intacto (recurso logs://nginx/access)
#  - access-canario.log -> formato extendido CON request_id, solo para
#    diagnóstico humano; NO es un recurso MCP y no sustituye al principal.
#  - La correlación Nginx->Node viaja en el HEADER X-Request-Id que este
#    Nginx SOBRESCRIBE con $request_id antes del proxy: Node lo adopta y
#    lo escribe en su NDJSON, donde node-json@1 sí lo conserva en
#    attributes.request_id del evento derivado.
log_format canario_lab escape=json '{"timestamp":"$time_iso8601","remote_addr":"$remote_addr",'
  '"remote_user":"$remote_user","method":"$request_method","path":"$uri",'
  '"status":$status,"upstream_status":"$upstream_status","protected":"$sentinel_protected"}';
log_format canario_diag escape=json '{"timestamp":"$time_iso8601","remote_addr":"$remote_addr",'
  '"method":"$request_method","uri":"$request_uri","path":"$uri","status":$status,'
  '"upstream_status":"$upstream_status","request_id":"$request_id","request_time":$request_time,'
  '"user_agent":"$http_user_agent"}';

server {
    listen 127.0.0.1:8081;
    # En la VM se añade la IP privada del laboratorio SOLO tras verificar
    # el aislamiento (docs/10 §seguridad):  listen 192.168.122.210:8081;
    server_name _;
    root /srv/outsourcing-canario/frontend;
    index index.html;
    set $sentinel_protected "no";

    access_log /var/lib/epiphyllum-lab/logs/nginx/access.log canario_lab;
    access_log /var/lib/epiphyllum-lab/logs/nginx/access-canario.log canario_diag;
    error_log  /var/lib/epiphyllum-lab/logs/nginx/error.log warn;

    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy same-origin;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Sobrescribe cualquier X-Request-Id del cliente: el identificador
        # de correlación nace AQUÍ, no lo elige el navegador.
        proxy_set_header X-Request-Id $request_id;
    }
    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
    # Nunca servir el fallback SPA para API inexistente:
    location /api/ { return 404 '{"error":{"code":"not_found","message":"Ruta API no encontrada."}}'; }
}
