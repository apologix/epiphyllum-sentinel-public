[package]
name = "epiphyllum-sentinel"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[dependencies]
anyhow = "=1.0.100"
axum = { version = "=0.8.6", features = ["json", "macros"] }
tokio = { version = "=1.48.0", features = ["full"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sqlx = { version = "=0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
uuid = { version = "=1.18.1", features = ["v4", "v5", "serde"] }
chrono = { version = "=0.4.42", features = ["serde"] }
sha2 = "=0.10.9"
hex = "=0.4.3"
regex = "=1.12.2"
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
async-stream = "=0.3.6"
futures-util = "=0.3.31"
base64 = "=0.22.1"
libc = "=0.2.177"
aes-gcm = "=0.10.3"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "json"] }

[dev-dependencies]
tempfile = "=3.23.0"
