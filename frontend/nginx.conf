pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
 resolver 127.0.0.11 valid=2s ipv6=off;
 resolver_timeout 2s;
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 client_body_temp_path /tmp/client_temp;
 proxy_temp_path /tmp/proxy_temp;
 fastcgi_temp_path /tmp/fastcgi_temp;
 uwsgi_temp_path /tmp/uwsgi_temp;
 scgi_temp_path /tmp/scgi_temp;
 server {
  listen 8080;
  server_name localhost;
  root /usr/share/nginx/html;
  client_max_body_size 64k;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  location /api/ {
   set $backend_origin http://backend:8000;
   proxy_pass $backend_origin;
   proxy_set_header Host $http_host;
   proxy_http_version 1.1;
   proxy_buffering off;
   proxy_read_timeout 1h;
  }
  location /metrics { return 404; }
  location / { try_files $uri /index.html; }
 }
}
